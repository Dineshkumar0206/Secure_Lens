version: "1"

services:
  # ─── Backend Service ─────────────────────────────
  - type: web
    name: securelens-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: SERVER_PORT
        value: "8090"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        value: "securelens_db"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false

  # ─── Frontend Service ────────────────────────────
  - type: web
    name: securelens-frontend
    runtime: docker
    rootDir: frontend
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: REACT_APP_API_URL
        sync: false
