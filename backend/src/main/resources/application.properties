

# ============================================
# SecureLens - Spring Boot Configuration
# ============================================

# Server port
server.port=${SERVER_PORT:8090}

# ─── Database (MySQL) ───────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:securelens_db}?sslMode=${DB_SSL_MODE:PREFERRED}&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:0206}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate (Hibernate 6 Dialect) ────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ─── JWT Configuration ──────────────────────
# Secret key (use a strong 256-bit base64 secret in production)
app.jwt.secret=${JWT_SECRET:4ec5e8b05fa878462bd10e0a722c6656bc02811343163b210e281fc0ac52030a}
app.jwt.expiration=86400000

# ─── CORS Configuration ─────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ─── Password Reset ─────────────────────────
app.reset-token-hours=1

# ─── Google signin ───────────────────────
app.google.client-id=${GOOGLE_CLIENT_ID:980019107126-trekepj3uiojgetr3hpeig4mt6a64lnj.apps.googleusercontent.com}

# ─── Logging ────────────────────────────────
logging.level.com.securelens=DEBUG
logging.level.org.springframework.security=INFO

# ─── Email toggles ─────────────────────────
app.email.enabled=true
# ─── Email (SMTP) ─────────────────────────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:securelensz@gmail.com}
spring.mail.password=${MAIL_PASSWORD:hnsc xwtr qyiv zswh}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.email.from=${MAIL_FROM:SecureLens <securelensz@gmail.com>}
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
